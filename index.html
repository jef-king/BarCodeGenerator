<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate and print custom CODE128 barcode sheets. Adjust prefixes, numbering, layout, size, and color with a live preview.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Jef-king">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Free CODE128 Barcode Generator">
    <meta property="og:description" content="Generate and print custom CODE128 barcode sheets with a live preview and flexible layout controls.">
    <title>Free CODE128 Barcode Generator | Printable Sheets</title>
    
    <!-- Professional Google Font for Heading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode library for barcode rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans text-slate-800">

    <header class="bg-indigo-600 text-white shadow-md no-print py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-[800] tracking-tight text-white drop-shadow-sm heading-font flex items-baseline gap-2">
                    BarCodeGenerator
                    <span class="text-lg font-[400] text-indigo-200 tracking-wider">CODE128</span>
                </h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-4 3H8v-4h8v4z"></path></svg>
                    Print A4 Sheet
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Controls Sidebar -->
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print space-y-5 h-fit">
            <h2 class="text-lg font-semibold text-slate-900 border-b pb-3 flex items-center justify-between">
                <span>Configuration</span>
                <span class="text-xs font-normal bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">Live Preview</span>
            </h2>

            <!-- Prefix and Start/End or Count -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Barcode Prefix / Text</label>
                    <input type="text" id="prefixInput" value="PROD-" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" oninput="updateBarcodes()">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Start Number</label>
                        <input type="number" id="startNum" value="1" min="0" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" oninput="updateBarcodes()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Total Count</label>
                        <input type="number" id="totalCount" value="100" min="1" max="500" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" oninput="updateBarcodes()">
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Columns (Grid)</label>
                        <select id="gridCols" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" onchange="updateBarcodes()">
                            <option value="2">2 Columns</option>
                            <option value="3">3 Columns</option>
                            <option value="4">4 Columns</option>
                            <option value="5" selected>5 Columns</option>
                            <option value="6">6 Columns</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Bar Width</label>
                        <select id="barWidth" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" onchange="updateBarcodes()">
                            <option value="1" selected>Thin (1)</option>
                            <option value="1.5">Medium (1.5)</option>
                            <option value="2">Thick (2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Barcode Height</label>
                        <input type="number" id="barHeight" value="15" min="10" max="100" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" oninput="updateBarcodes()">
                    </div>
                </div>

                <!-- Spacing and Color Options Row -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Bar Color</label>
                        <input type="color" id="barColor" value="#000000" class="w-full h-[38px] p-1 border border-slate-300 rounded-lg cursor-pointer bg-white" onchange="updateBarcodes()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Grid Spacing (px)</label>
                        <!-- Changed default value from 8 to 0 here -->
                        <input type="number" id="gridSpacing" value="0" min="0" max="50" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" oninput="updateBarcodes()">
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col items-center">
            
            <!-- Sheet Info Toolbar -->
            <div class="w-full max-w-[210mm] bg-white px-4 py-3 rounded-xl border border-slate-200 mb-4 flex items-center justify-between no-print shadow-xs">
                <div class="flex items-center gap-2 text-sm text-slate-600">
                    <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>A4 Sheet Preview (<span id="itemCountDisplay">100</span> Barcodes)</span>
                </div>
                <div class="text-xs text-slate-500 font-medium" id="pageCountDisplay">Pages: 1</div>
            </div>

            <!-- Printable A4 Sheet Wrapper -->
            <div id="printArea" class="bg-white shadow-xl rounded-lg w-full max-w-[210mm] p-[10mm] border border-slate-300 flex flex-col">
                
                <!-- Dynamic Barcode Grid container -->
                <div id="barcodeGridContainer" class="grid items-center justify-center w-full">
                    <!-- Barcodes inserted via JS -->
                </div>
            </div>
        </div>
    </main>

</body>
</html>
